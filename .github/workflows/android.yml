
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip -o AutoClickerArabic-Mobile.zip -d project
          find project -name gradlew -type f

      - name: Build APK
        run: |
          cd project
          PROJECT_DIR=$(find . -name gradlew -type f -printf '%h\n' | head -n 1)
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoClickerArabic-APK
          path: project/**/*.apk
          
